server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

spring:
  config:
    import: optional:file:.env[.properties]

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

email-hmac-key: ${EMAIL_HMAC_KEY}
email-from: ${EMAIL_FROM}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
    display-request-duration: true
    default-models-expand-depth: 2

spotify:
  client-id: ${SPOTIFY_CLIENT_ID}
  client-secret: ${SPOTIFY_CLIENT_SECRET}
  api-base-url: https://api.spotify.com/v1
  accounts-base-url: https://accounts.spotify.com
